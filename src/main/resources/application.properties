# Gives the Spring Boot application a readable name.
spring.application.name=school-management-system

# Connects Spring Boot to the existing file-based H2 database.
spring.datasource.url=jdbc:h2:file:./schooldb

# Default username used by the existing H2 database.
spring.datasource.username=sa

# The current local H2 database does not have a password.
spring.datasource.password=

# Tells Spring which JDBC driver should open the H2 database.
spring.datasource.driver-class-name=org.h2.Driver


# ==================== JPA AND HIBERNATE ====================

# Allows Hibernate to update missing tables and columns during development.
# It does not intentionally delete all existing data.
spring.jpa.hibernate.ddl-auto=update

# Displays SQL generated by Hibernate in the Run console.
spring.jpa.show-sql=true

# Formats generated SQL so it is easier to read.
spring.jpa.properties.hibernate.format_sql=true

# Prevents database sessions from remaining open during response rendering.
spring.jpa.open-in-view=false


# ==================== H2 CONSOLE ====================

# Enables H2's browser-based database management page.
spring.h2.console.enabled=true

# Makes the H2 console available at this address:
# http://localhost:8080/h2-console
spring.h2.console.path=/h2-console


# ==================== WEB SERVER ====================

# Runs the embedded Tomcat server on port 8080.
server.port=8080